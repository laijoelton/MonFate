# MonFate station-CCTV detection targets.
#
# Class names in the SAME ORDER as the model's output head (index == class_id).
#
# NOTE ON THE CURRENT WEIGHTS: models/detector.onnx and my_base_detector.pt were
# pre-trained for a different task and DO NOT yet predict these classes. Run the
# pipeline with --backend mock until a head is fine-tuned on labelled data.
# Incompatible existing checkpoints now fail class-map validation. Missing
# mobility.onnx weights fall back to explicitly simulated events. See models/README.md.
names:
  - wheelchair
  - stroller
  - mobility_aid      # walker, cane, crutches, guide animal
  - ambulant          # unassisted passenger — detected, never dispatched on
  - other

# Classes that count as an assistive-boarding request the gate/emitter reports.
# `ambulant` is deliberately excluded: an unassisted passenger is not a dispatch
# signal, and treating one as such would cry wolf at every stop.
accepted:
  - wheelchair
  - stroller
  - mobility_aid

# Detection score floor — boxes below this are never drawn or considered.
detection_confidence: 0.60

# An accepted-class detection scoring below this is downgraded to "other",
# so a low-confidence guess never triggers a dispatch alert on its own.
other_threshold: 0.70

# Frames of agreement the gate needs before it emits an accepted event.
# Higher than the industrial default: a false dispatch wastes a bus, and a
# passenger waiting at a stop is a persistent signal, not a transient one.
required_consecutive: 5

# Runtime model_version is a checkpoint SHA-256 fingerprint, or "mock".

# Adapting a third-party checkpoint (ONNX backend only).
#
# A checkpoint whose own labels differ from `names` above is rejected by
# default — a silent index mismatch would file strollers as wheelchairs. To use
# one, declare the mapping here and it is validated instead of guessed. Keys are
# the CHECKPOINT's labels, values are labels from `names`, or null to discard.
# Every checkpoint class must appear, so a class added upstream cannot quietly
# start firing dispatch events.
#
# To use the Roboflow wheelchair model locally (no frames leave the device):
#   1. Open the `wheelchair-9qvfx` project version 3 on roboflow.com
#   2. Download the version with format "ONNX" (not the hosted API snippet)
#   3. Save it as edge_vision/models/wheelchair.onnx
#   4. Uncomment the map below, correcting the keys to the exported label names
#   5. python -m edge_vision.run --weights edge_vision/models/wheelchair.onnx \
#          --backend onnx --source 0 --preview
#
# checkpoint_class_map:
#   wheelchair: wheelchair
#   person: null
